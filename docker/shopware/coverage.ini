pcov.enabled=1
pcov.directory=/var/www/html
pcov.exclude="~^/var/www/html/var/|/(?:tests?|Test|Tests|node_modules)/~"
; Every export is restricted to the authoritative application source inventory.
; Symfony's compiled container and Twig caches are never reported as application PHP.
opcache.enable=0
