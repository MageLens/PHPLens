services:
  app:
    image: ${SHOPWARE_IMAGE:?Use-bin/application-compose}
    user: "${LOCAL_UID}:${LOCAL_GID}"
    working_dir: /var/www/html
    command: [sh, /tools/serve.sh]
    depends_on:
      db:
        condition: service_healthy
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    environment:
      HOME: /tmp
      XDG_DATA_HOME: /state
      XDG_CONFIG_HOME: /tmp/config
      APP_ENV: dev
      APP_DEBUG: "0"
      # Remove the image's development secret so Symfony reads the project's own.
      APP_SECRET:
      APP_URL: ${SHOPWARE_ORIGIN:?Use bin/application-compose}
      APPLICATION_HTTPS_PORT: ${APPLICATION_HTTPS_PORT:-443}
      APPLICATION_PORT: ${APPLICATION_PORT:-80}
      APPLICATION_DOMAIN: ${APPLICATION_DOMAIN:-shopware.test}
      RUNNER_VIEW_PORT: ${RUNNER_VIEW_PORT:-6080}
      DATABASE_URL: mysql://shopware:shopware@db:3306/shopware
      DATABASE_REPLICA_0_URL: ""
      SHOPWARE_SKIP_WEBINSTALLER: "1"
      MAILER_DSN: "null://null"
      COMPOSER_HOME: /cache
      # Avoid announcing a restored shop to external Shopware services.
      SHOPWARE_DISABLE_UPDATE_CHECK: "1"
    ports:
      - "127.0.0.1:${APPLICATION_PORT:-80}:${APPLICATION_PORT:-80}"
      - "127.0.0.1:${APPLICATION_HTTPS_PORT:-443}:${APPLICATION_HTTPS_PORT:-443}"
      - "127.0.0.1:${RUNNER_VIEW_PORT:-6080}:${RUNNER_VIEW_PORT:-6080}"
    networks:
      default:
        aliases: ["${APPLICATION_DOMAIN:-shopware.test}"]
    volumes:
      - ./src:/var/www/html
      - ./docker/shopware:/tools:ro
      - ./coverage.config.json:/coverage-config.json:ro
      - ./.runtime/caddy:/state
      - ./.runtime/composer:/cache
      - ./coverage:/reports:ro
  runner:
    profiles: [coverage]
    init: true
    image: ${COMPOSE_PROJECT_NAME:-shopware}-runner-${MAGELENS_RUNNER:-cypress}
    build:
      context: .
      dockerfile: docker/runner/Dockerfile
      target: ${MAGELENS_RUNNER:-cypress}
      args:
        RUNNER_IMAGE: ${RUNNER_IMAGE}
        PLAYWRIGHT_RUNNER_IMAGE: ${PLAYWRIGHT_RUNNER_IMAGE}
        CHROME_VERSION: ${CHROME_VERSION}
        CHROME_LINUX_X64_SHA256: ${CHROME_LINUX_X64_SHA256}
        CHROME_LINUX_ARM64_SHA256: ${CHROME_LINUX_ARM64_SHA256}
    user: "${LOCAL_UID}:${LOCAL_GID}"
    working_dir: /workspace
    shm_size: 1gb
    environment:
      HOME: /tmp/runner-home
      XDG_CONFIG_HOME: /tmp/runner-home/.config
      MAGELENS_RUNNER: ${MAGELENS_RUNNER:-cypress}
      PHPLENS_PLATFORM: shopware
      CHROME_VERSION: ${CHROME_VERSION}
      APPLICATION_DOMAIN: ${APPLICATION_DOMAIN}
      RUNNER_VIEW_PORT: ${RUNNER_VIEW_PORT:-6080}
      CYPRESS_BASE_URL: ${SHOPWARE_ORIGIN}
      PLAYWRIGHT_BASE_URL: ${SHOPWARE_ORIGIN}
      DISPLAY: ":99"
    volumes:
      - ./:/workspace
      - runner_modules:/workspace/node_modules
  db:
    image: ${DATABASE_IMAGE:?Use-bin/application-compose}
    environment:
      MARIADB_DATABASE: shopware
      MARIADB_USER: shopware
      MARIADB_PASSWORD: shopware
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    command: ["--max-allowed-packet=64M", "--log-bin-trust-function-creators=1"]
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 45
volumes:
  runner_modules:
  dbdata:
    labels:
      io.shopwarelens.checkout: ${SHOPWARE_CHECKOUT:?Use bin/application-compose}
