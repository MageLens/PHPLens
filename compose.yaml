services:
  app:
    image: ${SHOPWARE_IMAGE:?Use bin/application-compose}
    user: "${LOCAL_UID}:${LOCAL_GID}"
    working_dir: /var/www/html
    command: [sh, /tools/serve.sh]
    depends_on:
      db:
        condition: service_healthy
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    environment:
      HOME: /tmp
      XDG_DATA_HOME: /state
      XDG_CONFIG_HOME: /tmp/config
      APP_ENV: dev
      APP_DEBUG: "0"
      # Remove the image's development secret so Symfony reads the project's own.
      APP_SECRET:
      APP_URL: ${SHOPWARE_ORIGIN:?Use bin/application-compose}
      APPLICATION_HTTPS_PORT: ${APPLICATION_HTTPS_PORT:-443}
      APPLICATION_PORT: ${APPLICATION_PORT:-80}
      APPLICATION_DOMAIN: ${APPLICATION_DOMAIN:-shopware.test}
      DATABASE_URL: mysql://shopware:shopware@db:3306/shopware
      DATABASE_REPLICA_0_URL: ""
      SHOPWARE_SKIP_WEBINSTALLER: "1"
      MAILER_DSN: "null://null"
      COMPOSER_HOME: /cache
      # Avoid announcing a restored shop to external Shopware services.
      SHOPWARE_DISABLE_UPDATE_CHECK: "1"
    ports:
      - "127.0.0.1:${APPLICATION_PORT:-80}:${APPLICATION_PORT:-80}"
      - "127.0.0.1:${APPLICATION_HTTPS_PORT:-443}:${APPLICATION_HTTPS_PORT:-443}"
    networks:
      default:
        aliases: ["${APPLICATION_DOMAIN:-shopware.test}"]
    volumes:
      - ./src:/var/www/html
      - ./docker/shopware:/tools:ro
      - ./.runtime/caddy:/state
      - ./.runtime/composer:/cache
  db:
    image: ${DATABASE_IMAGE:?Use bin/application-compose}
    environment:
      MARIADB_DATABASE: shopware
      MARIADB_USER: shopware
      MARIADB_PASSWORD: shopware
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    command: ["--max-allowed-packet=64M", "--log-bin-trust-function-creators=1"]
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 45
volumes:
  dbdata:
    labels:
      io.shopwarelens.checkout: ${SHOPWARE_CHECKOUT:?Use bin/application-compose}
